site_name: NHIS Data Documentation
site_description: Unofficial documentation for the research databases of the Korean National Health Insurance Service
site_author: Siho Park
site_url: https://siho-park.github.io/nhis-documentation/
repo_url: https://github.com/siho-park/nhis-documentation
repo_name: nhis-documentation
edit_uri: edit/main/docs/
copyright: Content licensed under CC BY 4.0. Not affiliated with the National Health Insurance Service.

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search:
      lang:
        - en
        - ko
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      archive: false
      pagination: false
  - gen-files:
      scripts:
        - scripts/gen_codebook.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/extra.css

hooks:
  - scripts/blog_categories.py

extra:
  # Order of the categories on the Working with the data page and in its sidebar
  blog_categories:
    - Getting started
    - Measurement
    - Caveats

validation:
  links:
    anchors: warn

nav:
  - Home:
      - index.md
      - Contributing: about/contributing.md
      - How to cite: about/cite.md
  - Program and data:
      - overview/index.md
      - The health insurance system: overview/system.md
      - NHIS research databases: overview/databases.md
      - Applying for data: overview/access.md
  - Datasets:
      - datasets/index.md
      - Sample Database:
          - National Sample Cohort: datasets/nsc.md
          - Health Screening Cohort: datasets/heals.md
          - Senior Cohort: datasets/senior.md
          - Low-Risk Cohort: datasets/low-risk.md
      - Customized Database:
          - Customized Research DB: datasets/customized.md
      - Sources and versions: datasets/sources.md
  - Variables: variables/
  - Working with the data:
      - blog/index.md
  - Glossary: glossary.md
  - References: references.md
